[mgr]
ratio=[2, 3, 3]
sort_by="alphabetical"
sort_dir_first=true
linemode="size"
show_hidden=true

[preview]
tab_size=3

[opener]
libreoffice = [
    { run = "libreoffice %s1", desc = "Libreoffice", block = false, orphan = true, for = "unix"}
]
run = [
    { run = "%s1", desc= "Execute", block = true, for = "unix"},
    { run = "%s1", desc= "Execute", block = true, for = "windows"},
]
neovim = [
    { run = "nvim %s",  desc = "Neovim", block = true },
]
web = [
    { run = "brave %s", desc = "Browser", block = false, orphan = true, for = "unix" },
]
pdf_app = [
    { run = "evince %s", desc = "Evince", block = false, orphan = true, for = "unix" },
]
img_app = [
    { run = "gimp %s", desc = "Gimp", block = false, orphan = true, for = "unix" },
]
windows_open = [
    { run = 'explorer "%s1"', orphan = true, desc = "Open", for = "windows" },
]

[open]
rules = [
    { mime = "*msword", use = ["windows_open", "libreoffice"] },
    { mime = "*opendocument*", use = ["windows_open", "libreoffice"] },
    { mime = "*officedocument*", use = ["windows_open", "libreoffice"] },
    { mime = "*html", use = ["windows_open", "web", "neovim"] },
    { mime = "text*", use = "neovim" },
    { mime = "inode/empty", use = "neovim" },
    { mime = "*javascript", use = "neovim" },
    { mime = "*wine*", use = "neovim" },
    { mime = "*pdf", use = ["web", "pdf_app", "windows_open"] },
    { mime = "image*", use = ["web", "img_app", "windows_open"] },
    { mime = "*executable*", use = "run" },
    { mime = "*json*", use = "neovim" },
]
